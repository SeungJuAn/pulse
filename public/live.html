<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pulse · 실시간 시세</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: ui-sans-serif, system-ui, sans-serif;
    margin: 0; padding: 24px; line-height: 1.5;
    background: #0f1115; color: #e6e8eb;
  }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { font-size: 13px; opacity: .6; margin: 0 0 20px; }
  #status {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 13px; padding: 4px 10px; border-radius: 999px;
    background: #1c2028; margin-bottom: 20px;
  }
  #status .dot { width: 8px; height: 8px; border-radius: 50%; background: #e5484d; }
  #status.on .dot { background: #46a758; }
  table { width: 100%; border-collapse: collapse; margin-bottom: 24px; }
  th, td { text-align: left; padding: 8px 12px; font-size: 14px; border-bottom: 1px solid #262a33; }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; opacity: .55; font-weight: 600; }
  td.price { font-variant-numeric: tabular-nums; font-weight: 600; }
  tr.flash td { animation: flash .6s ease; }
  @keyframes flash { from { background: #2d3a2e; } to { background: transparent; } }
  #log { font-size: 12px; opacity: .7; max-height: 220px; overflow-y: auto; font-variant-numeric: tabular-nums; }
  #log div { padding: 2px 0; border-bottom: 1px solid #1c2028; }
  h2 { font-size: 13px; opacity: .6; margin: 0 0 8px; }
</style>
</head>
<body>
  <h1>Pulse · 실시간 시세</h1>
  <p class="sub">서버(QuoteGateway)가 push하는 <code>quote</code> 이벤트를 그대로 표시합니다.</p>
  <div id="status"><span class="dot"></span><span id="statusText">연결 중…</span></div>

  <h2>최신 시세 (심볼 · 소스별)</h2>
  <table>
    <thead><tr><th>심볼</th><th>소스</th><th>가격</th><th>수신 시각</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>

  <h2>수신 로그</h2>
  <div id="log"></div>

  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
  <script>
    const status = document.getElementById("status");
    const statusText = document.getElementById("statusText");
    const rows = document.getElementById("rows");
    const log = document.getElementById("log");
    const cells = {};

    const socket = io("http://localhost:3000");

    socket.on("connect", () => {
      status.classList.add("on");
      statusText.textContent = "연결됨 (" + socket.id + ")";
    });
    socket.on("disconnect", () => {
      status.classList.remove("on");
      statusText.textContent = "연결 끊김";
    });

    socket.on("quote", (q) => {
      const key = q.symbol + "|" + q.source;
      const time = new Date().toLocaleTimeString("ko-KR");

      let tr = cells[key];
      if (!tr) {
        tr = document.createElement("tr");
        tr.innerHTML =
          "<td>" + q.symbol + "</td><td>" + q.source +
          "</td><td class='price'></td><td class='time'></td>";
        rows.appendChild(tr);
        cells[key] = tr;
      }
      tr.querySelector(".price").textContent = q.price;
      tr.querySelector(".time").textContent = time;
      tr.classList.remove("flash");
      void tr.offsetWidth;
      tr.classList.add("flash");

      const line = document.createElement("div");
      line.textContent = time + "  " + q.symbol + "  " + q.source + "  " + q.price;
      log.prepend(line);
      if (log.childNodes.length > 100) log.removeChild(log.lastChild);
    });
  </script>
</body>
</html>
